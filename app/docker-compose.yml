version: '3.9'

services:
  mysql:
    image: mysql:8.0              
    container_name: mysql_db     
    restart: always             
    environment:
      MYSQL_ROOT_PASSWORD: rootpass    
      MYSQL_DATABASE: app_db            
      MYSQL_USER: app_user             
      MYSQL_PASSWORD: userpass         
    ports:
      - "3306:3306"              
    volumes:
      - mysql_data:/var/lib/mysql   

  app:
    image: my_app_image            
    container_name: my_app
    restart: on-failure
    ports:
      - "8080:8080"              
    environment:
      DB_HOST: mysql              
      DB_PORT: 3306
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: userpass
    depends_on:
      - mysql                     

volumes:
  mysql_data: